[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[context.production]
  command = "npm run build"

[context.preview]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[env]
  [env.production]
    NODE_ENV = "production"
    NEXT_PUBLIC_API_URL = "https://your-domain.netlify.app"
